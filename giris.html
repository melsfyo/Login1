<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Sayfası</title>
  <link rel="icon" type="image/png" href="logo.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #e9a9db;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 20px 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    input {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      background-color: #cf9be4;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #d68ac6;
    }

    #error {
      color: red;
    }

    #success {
      color: green;
    }

    .footer {
      font-size: 12px;
      text-align: center;
      padding: 15px 10px;
      background-color: #e9a2f2;
      color: #333;
      width: 100%;
      position: relative;
      bottom: 0;
    }

    #sakura-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .petal {
      position: absolute;
      top: -30px;
      width: 20px;
      height: 20px;
      background: radial-gradient(ellipse at center, #f9c1d9 0%, #fbcfe8 70%);
      border-radius: 50%;
      opacity: 0.8;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>

  <div id="sakura-container"></div>

  <div class="box">
    <h2>Giriş Yap</h2>
    <input type="text" id="loginUser" placeholder="Kullanıcı Adı">
    <input type="password" id="loginPass" placeholder="Şifre">
    <button onclick="login()">Giriş</button>
  </div>

  <div class="box">
    <h2>Kayıt Ol</h2>
    <input type="text" id="regUser" placeholder="Yeni Kullanıcı Adı">
    <input type="password" id="regPass" placeholder="Yeni Şifre">
    <button onclick="register()">Kayıt Ol</button>
  </div>

  <p id="error"></p>
  <p id="success"></p>

  <div class="footer">© 2025 Tüm Hakları Saklıdır - Melisa Yüksel</div>

  <script>
    const container = document.getElementById('sakura-container');
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
      container.appendChild(petal);
      setTimeout(() => petal.remove(), 10000);
    }
    setInterval(createPetal, 300);
  </script>

  <script>
    function register() {
      const user = document.getElementById("regUser").value;
      const pass = document.getElementById("regPass").value;
      if (user && pass) {
        localStorage.setItem(user, pass);
        document.getElementById("success").textContent = "Kayıt başarılı!";
        document.getElementById("error").textContent = "";
      } else {
        document.getElementById("error").textContent = "Kullanıcı adı ve şifre giriniz!";
        document.getElementById("success").textContent = "";
      }
    }

    function login() {
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;
      const storedPass = localStorage.getItem(user);
      if (storedPass === pass) {
        window.location.href = "anasayfa.html";
      } else {
        document.getElementById("error").textContent = "Hatalı kullanıcı adı veya şifre!";
        document.getElementById("success").textContent = "";
      }
    }
  </script>

</body>
</html>
